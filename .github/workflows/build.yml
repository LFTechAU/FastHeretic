name: Build FastHeretic

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenWatcom 2
        uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"

      - name: Install NASM and DOSBox
        run: sudo apt-get update && sudo apt-get install -y nasm dosbox

      - name: Build
        run: |
          for m in y yh 13h cga bwc c16 512 cah cvb ega hgc inc pcp 400 t1 t12 t25 t43 t50 mda; do ./build.sh 386 $m; done
          ./build.sh 486 y
          ./build.sh 586 y
          ./build.sh stock

      - name: Bind DOS/32A extender
        run: |
          for f in build/*/fhtic*.exe; do ./bind.sh $f; done

      - name: Collect
        run: |
          mkdir dist
          cp build/*/FHTIC*.EXE dist/
          cp build/stock-13h/htic13f.exe dist/HTIC13F.EXE
          cp README.md dist/README.TXT
          cp heretic/license.txt dist/LICENSE.TXT

      - uses: actions/upload-artifact@v4
        with:
          name: FastHeretic-${{ github.run_number }}
          path: dist/
